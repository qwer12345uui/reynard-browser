name: Sync upstream into RootHide fork

# Upstream Reynard is merged with a "prefer upstream" strategy, then the
# RootHide-specific changes that cannot survive a plain merge are restored and
# re-applied by tools/ci/sync_roothide.py.
#
# Pushing the result to main changes browser/** and patches/**, so the job then
# requests "Build RootHide IPA" and the engine and app are rebuilt once this
# job finishes.

on:
  workflow_dispatch:
  # Triggered by a change to the sync tooling itself, which is also how a first
  # run is kicked off. The merge this job pushes touches browser/** and
  # patches/** only, so it can never re-trigger this workflow.
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-upstream.yml"
      - "tools/ci/sync_roothide.py"
      - "tools/ci/prefs_merge.py"

permissions:
  contents: write
  actions: write

concurrency:
  group: reynard-sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Merge upstream and restore RootHide changes
    runs-on: ubuntu-latest
    steps:
      - name: Check out fork
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge upstream and re-apply RootHide changes
        run: python3 tools/ci/sync_roothide.py

      - name: Push to main
        run: git push origin HEAD:main

      # A commit pushed with GITHUB_TOKEN does not start other workflows, so
      # the package build is requested explicitly. workflow_dispatch is not
      # subject to that restriction.
      - name: Start the RootHide IPA build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run build-trollstore.yml --ref main
