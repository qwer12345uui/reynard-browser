name: Sync upstream into RootHide fork

# Upstream Reynard is merged with a "prefer upstream" strategy, then the
# RootHide-specific changes that cannot survive a plain merge are restored and
# re-applied by tools/ci/sync_roothide.py.
#
# Pushing the result to main changes browser/** and patches/**, which triggers
# "Build RootHide IPA" automatically, so the engine and app are rebuilt once
# this job finishes.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reynard-sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Merge upstream and restore RootHide changes
    runs-on: ubuntu-latest
    steps:
      - name: Check out fork
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge upstream and re-apply RootHide changes
        run: python3 tools/ci/sync_roothide.py

      - name: Push to main
        run: git push origin HEAD:main
