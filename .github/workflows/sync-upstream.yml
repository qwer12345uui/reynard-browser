name: Sync upstream into RootHide fork

# Upstream Reynard is merged with a "prefer upstream" strategy, then the
# RootHide-specific changes that cannot survive a plain merge are restored and
# re-applied by tools/ci/sync_roothide.py.
#
# Pushing the result to main changes browser/** and patches/**. "Build RootHide
# IPA" listens for this workflow with a workflow_run trigger and rebuilds the
# engine and the app once this job finishes.

on:
  workflow_dispatch:
  # Triggered by a change to the sync tooling itself, which is also how a first
  # run is kicked off. The merge this job pushes touches browser/** and
  # patches/** only, so it can never re-trigger this workflow.
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-upstream.yml"
      - "tools/ci/sync_roothide.py"
      - "tools/ci/prefs_merge.py"

permissions:
  contents: write
  actions: write

concurrency:
  group: reynard-sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Merge upstream and restore RootHide changes
    runs-on: ubuntu-latest
    steps:
      - name: Check out fork
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge upstream and re-apply RootHide changes
        run: python3 tools/ci/sync_roothide.py

      # The merge can leave BrowserPreferences.swift structurally damaged and
      # SceneDelegate calling download entry points upstream has removed.
      # Repairing before the push means the tree handed to the IPA build already
      # compiles, instead of pushing damage that only surfaces an hour later in
      # the Xcode archive step.
      - name: Repair merged browser sources
        run: |
          python3 tools/ci/repair_preferences.py
          if git diff --quiet; then
            echo "Nothing left to repair; the merged tree is already healthy."
          else
            git add browser
            git commit -m "fix: 合并后自愈 browser 源文件"
          fi

      - name: Push to main
        run: git push origin HEAD:main

      # No explicit dispatch step here on purpose. A commit pushed with
      # GITHUB_TOKEN does not raise push events, so "Build RootHide IPA" listens
      # for this workflow with a workflow_run trigger instead. Requesting it
      # from here as well would queue a duplicate multi-hour engine build.
