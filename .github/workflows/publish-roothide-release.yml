name: Publish RootHide IPA release

# Workflow artifacts can only be downloaded by a signed-in GitHub user, which
# makes them awkward to hand out. Publishing the verified IPA as a release
# asset gives a stable download URL that needs no login.
#
# Three triggers on purpose:
#   workflow_run      - fires right after every successful packaging build
#   push (this file)  - lets a fix be retried without rebuilding the app
#   workflow_dispatch - republish any past build by run id
on:
  workflow_run:
    workflows: ["Build RootHide IPA"]
    types: [completed]
  push:
    paths:
      - ".github/workflows/publish-roothide-release.yml"
  workflow_dispatch:
    inputs:
      run_id:
        description: "Build RootHide IPA run to publish (defaults to the newest successful one)"
        required: false

permissions:
  actions: read
  contents: write

# Publishing is cheap and idempotent, so never cancel a publish in flight.
concurrency:
  group: publish-roothide-release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish the built IPA as a release asset
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      # gh release create shells out to git to resolve --target, so it needs a
      # checkout even though this job only moves files around.
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: false

      - name: Resolve the source run
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id || github.event.inputs.run_id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ -z "$RUN_ID" ]; then
            # No triggering run: fall back to the newest successful package build.
            RUN_ID="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build-trollstore.yml/runs?status=success&per_page=10" \
              --jq '[.workflow_runs[] | select(.conclusion == "success")] | .[0].id // empty')"
          fi
          if [ -z "$RUN_ID" ]; then
            echo "::error title=No source run::No successful Build RootHide IPA run was found."
            exit 1
          fi
          if [ -z "$HEAD_SHA" ]; then
            HEAD_SHA="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .head_sha)"
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "Publishing artifacts of run $RUN_ID (${HEAD_SHA:0:7})"

      - name: Download the verified IPA artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "${{ steps.source.outputs.run_id }}" \
            --repo "$GITHUB_REPOSITORY" \
            --name "Reynard-RootHide-IPA-${{ steps.source.outputs.sha }}" \
            --dir ipa
          ipa_file="$(find ipa -type f -name 'Reynard-Jailbroken.ipa' | head -n 1)"
          if [ -z "$ipa_file" ]; then
            echo "::error title=IPA not found::The artifact did not contain the packaged IPA."
            find ipa -type f | head -n 20
            exit 1
          fi
          mkdir -p out
          cp "$ipa_file" out/Reynard-Jailbroken.ipa
          if [ -f "${ipa_file}.sha256" ]; then
            cp "${ipa_file}.sha256" out/Reynard-Jailbroken.ipa.sha256
          else
            shasum -a 256 out/Reynard-Jailbroken.ipa > out/Reynard-Jailbroken.ipa.sha256
          fi
          ls -l out

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="roothide-latest"
          short="${{ steps.source.outputs.sha }}"
          short="${short:0:7}"
          # Recreate the tag in place so the download URL stays stable across
          # builds instead of accumulating one release per commit.
          gh release delete "$tag" --yes --cleanup-tag >/dev/null 2>&1 || true
          set +e
          gh release create "$tag" \
            out/Reynard-Jailbroken.ipa \
            out/Reynard-Jailbroken.ipa.sha256 \
            --target "${{ steps.source.outputs.sha }}" \
            --title "Reynard RootHide IPA ($short)" \
            --notes "RootHide jailbreak build of ${{ steps.source.outputs.sha }}, unsigned. Install with TrollStore or a RootHide capable package manager. Built by run ${{ steps.source.outputs.run_id }}." \
            > release.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            # The run log needs admin rights to read, so surface the failure
            # as a check annotation instead.
            msg="$(head -n 8 release.log | cut -c1-300)"
            msg="${msg//'%'/'%25'}"
            msg="${msg//$'\n'/'%0A'}"
            msg="${msg//$'\r'/'%0D'}"
            echo "::error title=Release publish failed (exit $status)::$msg"
            exit "$status"
          fi
          cat release.log
          echo "Published $tag for $short"
