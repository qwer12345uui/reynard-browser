name: Refresh source metadata

# This workflow is deliberately manual and never creates, edits, or publishes a
# GitHub Release. Generated metadata is available only as an Actions artifact.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reynard-source-metadata-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh-source-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Regenerate source metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/update_source.py

      - name: Upload source metadata artifact
        uses: actions/upload-artifact@v4
        with:
          name: Reynard-source-metadata-${{ github.sha }}
          path: .github/source.json
          if-no-files-found: error
          retention-days: 30
