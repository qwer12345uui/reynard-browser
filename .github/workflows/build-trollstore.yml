name: Build TrollStore package

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-trollstore.yml"

permissions:
  contents: write

concurrency:
  group: reynard-trollstore-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 360

    steps:
      - name: Check out latest source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Verify Xcode and iOS SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install build dependencies
        run: |
          brew update
          brew install ldid llvm cbindgen
          rustup target add aarch64-apple-ios
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Restore build caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            support/idevice/target
            engine/firefox/obj-aarch64-apple-ios
          key: reynard-ios-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('engine/release.txt', 'patches/**/*.patch', 'support/idevice/Cargo.lock') }}
          restore-keys: |
            reynard-ios-${{ runner.os }}-${{ runner.arch }}-

      - name: Sync Gecko source
        run: ./tools/development/update-gecko.sh

      - name: Apply Reynard patches
        run: ./tools/development/apply-patches.sh </dev/null

      - name: Build idevice dependency
        run: ./tools/development/build-idevice.sh

      - name: Prepare Gecko build configuration
        run: test -f engine/firefox/.mozconfig || touch engine/firefox/.mozconfig

      - name: Build Gecko engine
        shell: bash
        run: |
          set +e
          LLVM_PREFIX="$(brew --prefix llvm)"
          TOOLCHAIN_DIR="$RUNNER_TEMP/reynard-toolchain"
          mkdir -p "$TOOLCHAIN_DIR"
          cat > "$TOOLCHAIN_DIR/ld64.lld" <<'EOF'
          #!/bin/bash
          for arg in "$@"; do
            if [ "$arg" = "--version" ]; then
              echo "LLD 19.1.0 (Apple ld compatibility wrapper)"
              exit 0
            fi
          done
          exec "$(xcrun --find ld)" "$@"
          EOF
          chmod +x "$TOOLCHAIN_DIR/ld64.lld"
          export PATH="$LLVM_PREFIX/bin:$TOOLCHAIN_DIR:$PATH"
          export CC="$LLVM_PREFIX/bin/clang -B$TOOLCHAIN_DIR"
          export CXX="$LLVM_PREFIX/bin/clang++ -B$TOOLCHAIN_DIR"
          ./tools/development/build-gecko.sh 2>&1 | tee gecko-build.log
          STATUS=${PIPESTATUS[0]}
          if [ "$STATUS" -ne 0 ]; then
            MESSAGE="$(tail -n 25 gecko-build.log)"
            MESSAGE="${MESSAGE//'%'/'%25'}"
            MESSAGE="${MESSAGE//$'\n'/'%0A'}"
            MESSAGE="${MESSAGE//$'\r'/'%0D'}"
            echo "::error file=.github/workflows/build-trollstore.yml,title=Gecko build failed::$MESSAGE"
            exit "$STATUS"
          fi

      - name: Archive Reynard app
        env:
          CODE_SIGNING_ALLOWED: "NO"
          CODE_SIGNING_REQUIRED: "NO"
          EXPANDED_CODE_SIGN_IDENTITY: "-"
        run: ./tools/release/build-app.sh

      - name: Package TrollStore build
        run: ./tools/release/create-ipa.sh

      - name: Verify package
        run: |
          test -s dist/Reynard-TrollStore.tipa
          shasum -a 256 dist/Reynard-TrollStore.tipa | tee dist/Reynard-TrollStore.tipa.sha256
          unzip -t dist/Reynard-TrollStore.tipa

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Reynard-TrollStore-${{ github.sha }}
          path: |
            dist/Reynard-TrollStore.tipa
            dist/Reynard-TrollStore.tipa.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish automated prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          TAG="automated-${SHORT_SHA}"
          gh release create "$TAG" \
            dist/Reynard-TrollStore.tipa \
            dist/Reynard-TrollStore.tipa.sha256 \
            --target "$GITHUB_SHA" \
            --title "Automated TrollStore build ${SHORT_SHA}" \
            --notes "Automated unsigned TrollStore build from commit ${GITHUB_SHA}." \
            --prerelease
