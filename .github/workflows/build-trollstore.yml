name: Build TrollStore package

# Build trigger: manual dispatch, or pushes that touch build inputs
# (workflow, build tools, browser sources, engine patches, engine release).
# The gecko job stores the compiled engine as an artifact keyed by its
# inputs. App-only changes reuse the exact engine and finish in minutes;
# a full rebuild only runs when the Gecko source, patches, or build scripts change.
on:
  workflow_dispatch:
    inputs:
      rebuild_gecko:
        description: "Force a full Gecko engine rebuild"
        type: boolean
        default: false
  push:
    paths:
      - ".github/workflows/build-trollstore.yml"
      - "tools/release/**"
      - "tools/development/**"
      - "browser/**"
      - "patches/**"
      - "engine/release.txt"

permissions:
  actions: read
  contents: write

concurrency:
  group: reynard-trollstore-build
  cancel-in-progress: true

jobs:
  gecko:
    runs-on: macos-26
    timeout-minutes: 360
    outputs:
      key: ${{ steps.key.outputs.value }}
    steps:
      - name: Check out latest source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Compute Gecko input key
        id: key
        env:
          GECKO_HASH: ${{ hashFiles('engine/release.txt', 'patches/**/*.patch', 'tools/development/build-gecko.sh', 'tools/development/apply-patches.sh', 'tools/development/update-gecko.sh') }}
        run: echo "value=$GECKO_HASH" >> "$GITHUB_OUTPUT"

      - name: Check for reusable Gecko build
        id: probe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ inputs.rebuild_gecko }}" = "true" ]; then
            echo "Forced rebuild requested."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          NAME="gecko-dist-${{ steps.key.outputs.value }}"
          FOUND=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$NAME&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false)] | length')
          echo "Reusable artifacts named $NAME: $FOUND"
          if [ "$FOUND" -gt 0 ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify Xcode and iOS SDK
        if: steps.probe.outputs.found != 'true'
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install build dependencies
        if: steps.probe.outputs.found != 'true'
        run: |
          brew update
          brew install ldid cbindgen
          rustup target add aarch64-apple-ios

      - name: Sync Gecko source
        if: steps.probe.outputs.found != 'true'
        run: ./tools/development/update-gecko.sh

      - name: Apply Reynard patches
        if: steps.probe.outputs.found != 'true'
        run: ./tools/development/apply-patches.sh </dev/null

      - name: Prepare Gecko build configuration
        if: steps.probe.outputs.found != 'true'
        shell: bash
        run: |
          test -f engine/firefox/.mozconfig || touch engine/firefox/.mozconfig
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/development/build-gecko.sh')
          text = path.read_text()
          needle = '\techo "ac_add_options --disable-tests"\n'
          replacement = needle + '\techo "ac_add_options --without-wasm-sandboxed-libraries"\n'
          if needle not in text:
              raise SystemExit('Could not patch build-gecko.sh')
          path.write_text(text.replace(needle, replacement, 1))
          PY

      - name: Build Gecko engine
        if: steps.probe.outputs.found != 'true'
        shell: bash
        run: |
          set +e
          TOOLCHAIN_DIR="$RUNNER_TEMP/reynard-toolchain"
          REAL_LD="$(xcrun --find ld)"
          APPLE_CLANG="$(xcrun --find clang)"
          APPLE_CLANGXX="$(xcrun --find clang++)"
          MACOS_SDK="$(find "$(xcode-select -p)/Platforms/MacOSX.platform/Developer/SDKs" -maxdepth 1 -type d -name 'MacOSX*.sdk' | sort -V | tail -n 1)"
          test -x "$REAL_LD"
          test -x "$APPLE_CLANG"
          test -x "$APPLE_CLANGXX"
          test -d "$MACOS_SDK"
          mkdir -p "$TOOLCHAIN_DIR"
          cat > "$TOOLCHAIN_DIR/ld64.lld" <<EOF
          #!/bin/bash
          for arg in "\$@"; do
            if [ "\$arg" = "--version" ]; then
              echo "LLD 19.1.0 (Apple ld compatibility wrapper)"
              exit 0
            fi
          done
          exec "$REAL_LD" "\$@"
          EOF
          chmod +x "$TOOLCHAIN_DIR/ld64.lld"
          export PATH="$TOOLCHAIN_DIR:$PATH"
          export CC="$APPLE_CLANG -B$TOOLCHAIN_DIR"
          export CXX="$APPLE_CLANGXX -B$TOOLCHAIN_DIR"
          export SDKROOT="$MACOS_SDK"
          ./tools/development/build-gecko.sh 2>&1 | tee gecko-build.log
          STATUS=${PIPESTATUS[0]}
          if [ "$STATUS" -ne 0 ]; then
            FAILED_LINE="$(grep -n -m1 'failed to run custom build command' gecko-build.log | cut -d: -f1)"
            if [ -n "$FAILED_LINE" ]; then
              START=$((FAILED_LINE > 5 ? FAILED_LINE - 5 : 1))
              END=$((FAILED_LINE + 45))
              MESSAGE="$(sed -n "${START},${END}p" gecko-build.log)"
            else
              MESSAGE="$(grep -nE 'fatal error:|(^|[^[:alpha:]])error(\[[^]]+\]|:)|Undefined symbols|undefined reference|ld:' gecko-build.log | tail -n 30)"
            fi
            if [ -z "$MESSAGE" ]; then MESSAGE="$(tail -n 30 gecko-build.log)"; fi
            MESSAGE="${MESSAGE//'%'/'%25'}"
            MESSAGE="${MESSAGE//$'\n'/'%0A'}"
            MESSAGE="${MESSAGE//$'\r'/'%0D'}"
            echo "::error file=.github/workflows/build-trollstore.yml,title=Gecko compiler diagnostics::$MESSAGE"
            exit "$STATUS"
          fi

      - name: Upload Gecko build products
        if: steps.probe.outputs.found != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gecko-dist-${{ steps.key.outputs.value }}
          path: |
            engine/firefox/obj-aarch64-apple-ios/dist
            engine/firefox/toolkit/mozapps/extensions/default-theme
          if-no-files-found: error
          # Keep the exact compiled Gecko product for the longest Actions
          # artifact lifetime so routine upstream/app merges package directly.
          retention-days: 90

  package:
    runs-on: macos-26
    timeout-minutes: 90
    needs: gecko
    steps:
      - name: Check out latest source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Restore Gecko build products
        id: restore
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GECKO_KEY: ${{ needs.gecko.outputs.key }}
        shell: bash
        run: |
          set -e
          NAME="gecko-dist-$GECKO_KEY"
          ARTIFACT_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$NAME&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .id')
          if [ -z "$ARTIFACT_ID" ] || [ "$ARTIFACT_ID" = "null" ]; then
            echo "::error title=Missing Gecko artifact::No usable artifact named $NAME was found."
            exit 1
          fi
          echo "Downloading Gecko build products from artifact $ARTIFACT_ID"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > gecko-dist.zip
          rm -rf "$RUNNER_TEMP/gecko-dist"
          mkdir -p "$RUNNER_TEMP/gecko-dist"
          unzip -q gecko-dist.zip -d "$RUNNER_TEMP/gecko-dist"
          mkdir -p engine/firefox/toolkit/mozapps/extensions
          cp -R "$RUNNER_TEMP/gecko-dist/obj-aarch64-apple-ios" engine/firefox/
          cp -R "$RUNNER_TEMP/gecko-dist/toolkit/mozapps/extensions/default-theme" engine/firefox/toolkit/mozapps/extensions/
          test -d engine/firefox/obj-aarch64-apple-ios/dist/bin
          test -d engine/firefox/toolkit/mozapps/extensions/default-theme
          echo "Gecko build products restored."

      - name: Install packaging dependencies
        run: |
          brew update
          brew install ldid cbindgen
          rustup target add aarch64-apple-ios

      - name: Build idevice dependency
        run: ./tools/development/build-idevice.sh

      - name: Prepare unsigned build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('browser/Reynard.xcodeproj/project.pbxproj')
          text = path.read_text()
          needle = '\t\t\t\t02PROCOPY2F3000000000001 /* Embed Process Extensions */,\n'
          if needle in text:
              path.write_text(text.replace(needle, '', 1))
              print('Removed the Embed Process Extensions phase for the unsigned CI build.')
          else:
              print('::warning title=Unsigned build patch::Embed Process Extensions phase not found; project left unchanged.')
          PY

      - name: Archive Reynard app
        shell: bash
        run: |
          set +e
          sh ./tools/release/build-app.sh 2>&1 | tee archive.log
          STATUS=${PIPESTATUS[0]}
          if [ "$STATUS" -ne 0 ]; then
            {
              grep -nE 'error: |Command .* failed|BUILD FAILED|ValidateEmbeddedBinary|PhaseScriptExecution|CodeSign' archive.log | head -n 40
              echo '--- log tail ---'
              tail -n 20 archive.log
            } | cut -c1-400 > diagnostics.txt
            MESSAGE="$(cat diagnostics.txt)"
            MESSAGE="${MESSAGE//'%'/'%25'}"
            MESSAGE="${MESSAGE//$'\n'/'%0A'}"
            MESSAGE="${MESSAGE//$'\r'/'%0D'}"
            echo "::error title=Archive diagnostics::$MESSAGE"
            exit "$STATUS"
          fi

      - name: Package TrollStore build
        shell: bash
        run: |
          set +e
          sh ./tools/release/create-ipa.sh 2>&1 | tee package.log
          STATUS=${PIPESTATUS[0]}
          if [ "$STATUS" -ne 0 ]; then
            MESSAGE="$(tail -n 50 package.log | cut -c1-400)"
            MESSAGE="${MESSAGE//'%'/'%25'}"
            MESSAGE="${MESSAGE//$'\n'/'%0A'}"
            MESSAGE="${MESSAGE//$'\r'/'%0D'}"
            echo "::error title=Packaging diagnostics::$MESSAGE"
            exit "$STATUS"
          fi

      - name: Verify package
        run: |
          test -s dist/Reynard-TrollStore.tipa
          shasum -a 256 dist/Reynard-TrollStore.tipa | tee dist/Reynard-TrollStore.tipa.sha256
          unzip -t dist/Reynard-TrollStore.tipa

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Reynard-TrollStore-${{ github.sha }}
          path: |
            dist/Reynard-TrollStore.tipa
            dist/Reynard-TrollStore.tipa.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish automated prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          TAG="automated-${SHORT_SHA}"
          gh release create "$TAG" \
            dist/Reynard-TrollStore.tipa \
            dist/Reynard-TrollStore.tipa.sha256 \
            --target "$GITHUB_SHA" \
            --title "Automated TrollStore build ${SHORT_SHA}" \
            --notes "Automated unsigned TrollStore build from commit ${GITHUB_SHA}." \
            --prerelease

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: package-logs-${{ github.sha }}
          path: |
            archive.log
            package.log
          if-no-files-found: ignore
          retention-days: 7
