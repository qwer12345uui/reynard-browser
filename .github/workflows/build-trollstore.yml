name: Build RootHide IPA

# The compiled Gecko engine and the application dependency tree have deliberately
# separate reuse boundaries. UI/source-only pushes restore the immutable Gecko
# product and rebuild only the application package.
on:
  workflow_dispatch:
    inputs:
      rebuild_gecko:
        description: "Force a full Gecko engine rebuild"
        type: boolean
        default: false
  # A commit pushed by the upstream sync job carries GITHUB_TOKEN, and such a
  # commit does not raise push events. Listen for the sync workflow instead so
  # every merged upstream change is rebuilt automatically.
  workflow_run:
    workflows: ["Sync upstream into RootHide fork"]
    types: [completed]
  push:
    paths:
      - ".github/workflows/build-trollstore.yml"
      - "tools/release/**"
      - "tools/development/**"
      - "browser/**"
      - "patches/**"
      - "engine/release.txt"

permissions:
  actions: read
  contents: read

# A newer commit supersedes an older one, so cancel whatever is still running.
# The engine product is keyed by the patch set and kept as a long-lived
# artifact, so cancelling a stale run never loses a finished engine.
concurrency:
  group: reynard-ios-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gecko:
    name: Prepare reusable Gecko engine
    runs-on: macos-26
    timeout-minutes: 360
    outputs:
      key: ${{ steps.key.outputs.value }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: false
          # Always build the commit this run is recorded against. Using
          # workflow_run.head_sha would check out the commit that triggered the
          # upstream sync, i.e. the pre-sync tree, so the merged result would
          # never actually be compiled.

      - name: Reuse the validated Gecko patch set
        # The reusable engine product was compiled from the patch tree of
        # 4577a44. The upstream sync replaced four patches afterwards, which
        # changes the product key and forces a six hour rebuild. Pinning the
        # patch tree keeps source-only changes cheap. Remove this step when the
        # engine genuinely has to be rebuilt from newer patches.
        run: |
          git checkout 4577a44 -- patches/
          git --no-pager diff --stat HEAD -- patches | tail -n 6

      - name: Compute Gecko product key
        id: key
        env:
          GECKO_HASH: ${{ hashFiles('engine/release.txt', 'patches/**/*.patch', 'tools/development/build-gecko.sh', 'tools/development/apply-patches.sh', 'tools/development/update-gecko.sh') }}
          GECKO_BUILD_VARIANT: ios-arm64-roothide-no-jemalloc-v2
        run: |
          echo "value=${{ runner.os }}-${{ runner.arch }}-${GECKO_HASH}-${GECKO_BUILD_VARIANT}" >> "$GITHUB_OUTPUT"

      # Layer 1: retain the complete, validated Gecko product as a long-lived
      # immutable Actions artifact. This is intentionally not a short-lived
      # dependency cache: a full engine build is expensive and must survive
      # ordinary app/UI commits for as long as the repository allows.
      - name: Look up reusable Gecko product
        id: gecko-product
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: reynard-gecko-engine-${{ steps.key.outputs.value }}
          FORCE_REBUILD: ${{ inputs.rebuild_gecko }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$FORCE_REBUILD" = "true" ]; then
            echo "A fresh Gecko build was requested."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          count=""
          for attempt in 1 2 3; do
            if count="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$ARTIFACT_NAME&per_page=100" \
              --jq '[.artifacts[] | select(.expired == false)] | length' 2>/dev/null)"; then
              break
            fi
            echo "Artifact lookup attempt $attempt failed; retrying."
            sleep 5
          done
          echo "Reusable artifacts named $ARTIFACT_NAME: $count"
          # Surfaced as a check annotation: the run log itself needs admin
          # rights, but annotations are readable and identify key drift.
          echo "::notice title=Gecko product key::$ARTIFACT_NAME (count=$count)"
          if [ "$count" -gt 0 ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify Xcode and iOS SDK
        if: steps.gecko-product.outputs.found != 'true'
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install Gecko build dependencies
        if: steps.gecko-product.outputs.found != 'true'
        run: |
          brew update
          brew install ldid cbindgen
          rustup target add aarch64-apple-ios

      - name: Synchronize Gecko source
        if: steps.gecko-product.outputs.found != 'true'
        # Every script is invoked through its interpreter on purpose: files
        # updated through the API lose their executable bit, and a direct
        # ./script call then fails with "Permission denied" (exit 126).
        run: zsh ./tools/development/update-gecko.sh

      - name: Apply Reynard patches
        if: steps.gecko-product.outputs.found != 'true'
        shell: bash
        run: |
          set +e
          zsh ./tools/development/apply-patches.sh </dev/null 2>&1 | tee patch-apply.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            message="$(tail -n 40 patch-apply.log | cut -c1-400)"
            message="${message//'%'/'%25'}"
            message="${message//$'\n'/'%0A'}"
            message="${message//$'\r'/'%0D'}"
            echo "::error title=Gecko patch diagnostics::$message"
            exit "$status"
          fi

      - name: Build Gecko engine
        if: steps.gecko-product.outputs.found != 'true'
        shell: bash
        run: |
          set +e
          toolchain_dir="$RUNNER_TEMP/reynard-toolchain"
          linker_log="$GITHUB_WORKSPACE/linker-diagnostics.log"
          real_ld="$(xcrun --find ld)"
          apple_clang="$(xcrun --find clang)"
          apple_clangxx="$(xcrun --find clang++)"
          macos_sdk="$(find "$(xcode-select -p)/Platforms/MacOSX.platform/Developer/SDKs" -maxdepth 1 -type d -name 'MacOSX*.sdk' | sort -V | tail -n 1)"
          test -x "$real_ld"
          test -x "$apple_clang"
          test -x "$apple_clangxx"
          test -d "$macos_sdk"
          mkdir -p "$toolchain_dir"
          : > "$linker_log"
          export REYNARD_LINKER_LOG="$linker_log"
          cat > "$toolchain_dir/ld64.lld" <<EOF
          #!/bin/bash
          for arg in "\$@"; do
            if [ "\$arg" = "--version" ]; then
              echo "LLD 19.1.0 (Apple ld compatibility wrapper)"
              exit 0
            fi
          done
          {
            printf '\n--- ld invocation ---\n'
            printf '%q ' "\$0" "\$@"
            printf '\n--- ld output ---\n'
          } >> "\$REYNARD_LINKER_LOG"
          "$real_ld" "\$@" 2>&1 | tee -a "\$REYNARD_LINKER_LOG"
          exit "\${PIPESTATUS[0]}"
          EOF
          chmod +x "$toolchain_dir/ld64.lld"
          export PATH="$toolchain_dir:$PATH"
          export CC="$apple_clang -B$toolchain_dir"
          export CXX="$apple_clangxx -B$toolchain_dir"
          export SDKROOT="$macos_sdk"
          # RootHide injection commonly uses libhooker. Avoid jemalloc so its
          # allocator hooks do not cause helper-process CPU spikes or stalls.
          sh ./tools/development/build-gecko.sh --disable-jemalloc 2>&1 | tee gecko-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            failed_line="$(grep -n -m1 'failed to run custom build command' gecko-build.log | cut -d: -f1)"
            if [ -n "$failed_line" ]; then
              start=$((failed_line > 5 ? failed_line - 5 : 1))
              end=$((failed_line + 45))
              message="$(sed -n "${start},${end}p" gecko-build.log)"
            else
              message="$(grep -nE 'fatal error:|(^|[^[:alpha:]])error(\[[^]]+\]|:)|Undefined symbols|undefined reference|ld:' gecko-build.log | tail -n 30)"
            fi
            if [ -z "$message" ]; then message="$(tail -n 30 gecko-build.log)"; fi
            message="${message//'%'/'%25'}"
            message="${message//$'\n'/'%0A'}"
            message="${message//$'\r'/'%0D'}"
            echo "::error file=.github/workflows/build-trollstore.yml,title=Gecko compiler diagnostics::$message"
            exit "$status"
          fi

      - name: Upload Gecko diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gecko-build-logs-${{ github.sha }}
          path: |
            patch-apply.log
            gecko-build.log
            linker-diagnostics.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload reusable Gecko product
        if: steps.gecko-product.outputs.found != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: reynard-gecko-engine-${{ steps.key.outputs.value }}
          path: |
            engine/firefox/obj-aarch64-apple-ios/dist
            engine/firefox/toolkit/mozapps/extensions/default-theme
          if-no-files-found: error
          retention-days: 90

  package:
    name: Build verified IPA artifacts
    runs-on: macos-26
    timeout-minutes: 100
    needs: gecko
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive
          # See the note in the gecko job: build the current run's commit.

      # Layer 2: package-time Rust registry, git sources and idevice output.
      # This key is independent of Gecko so UI and Swift-only changes reuse it.
      - name: Restore application dependency cache
        id: app-dependencies
        uses: actions/cache/restore@v4
        with:
          key: reynard-app-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/development/build-idevice.sh', 'support/idevice/Cargo.lock', 'support/idevice/ffi/Cargo.toml') }}
          restore-keys: |
            reynard-app-deps-${{ runner.os }}-${{ runner.arch }}-
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            support/idevice/target
            browser/Reynard/JIT/RPPairing/libidevice_ffi.a

      - name: Restore reusable Gecko product
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: reynard-gecko-engine-${{ needs.gecko.outputs.key }}
        shell: bash
        run: |
          set -euo pipefail
          artifact_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$ARTIFACT_NAME&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .id')"
          if [ -z "$artifact_id" ] || [ "$artifact_id" = "null" ]; then
            echo "::error title=Missing Gecko product::No reusable artifact named $ARTIFACT_NAME was found."
            exit 1
          fi
          echo "Downloading reusable Gecko product $artifact_id"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > gecko-product.zip
          rm -rf "$RUNNER_TEMP/reynard-gecko-product"
          mkdir -p "$RUNNER_TEMP/reynard-gecko-product"
          unzip -q gecko-product.zip -d "$RUNNER_TEMP/reynard-gecko-product"
          mkdir -p engine/firefox/toolkit/mozapps/extensions
          cp -R "$RUNNER_TEMP/reynard-gecko-product/obj-aarch64-apple-ios" engine/firefox/
          cp -R "$RUNNER_TEMP/reynard-gecko-product/toolkit/mozapps/extensions/default-theme" engine/firefox/toolkit/mozapps/extensions/
          test -d engine/firefox/obj-aarch64-apple-ios/dist/bin
          test -d engine/firefox/toolkit/mozapps/extensions/default-theme

      - name: Install packaging dependencies
        run: |
          brew update
          brew install ldid cbindgen
          rustup target add aarch64-apple-ios

      - name: Build idevice dependency
        run: zsh ./tools/development/build-idevice.sh

      - name: Save application dependency cache
        if: steps.app-dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: ${{ steps.app-dependencies.outputs.cache-primary-key }}
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            support/idevice/target
            browser/Reynard/JIT/RPPairing/libidevice_ffi.a

      - name: Prepare unsigned build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('browser/Reynard.xcodeproj/project.pbxproj')
          text = path.read_text()
          needle = '\t\t\t\t02PROCOPY2F3000000000001 /* Embed Process Extensions */,\n'
          if needle in text:
              path.write_text(text.replace(needle, '', 1))
              print('Removed the Embed Process Extensions phase for the unsigned CI build.')
          else:
              print('::warning title=Unsigned build patch::Embed Process Extensions phase not found; project left unchanged.')
          PY

      - name: Build unsigned Reynard app
        shell: bash
        run: |
          set +e
          sh ./tools/release/build-app.sh --no-signing 2>&1 | tee archive.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              grep -nE 'error: |Command .* failed|BUILD FAILED|ValidateEmbeddedBinary|PhaseScriptExecution|CodeSign' archive.log | head -n 40
              echo '--- log tail ---'
              tail -n 20 archive.log
            } | cut -c1-400 > diagnostics.txt
            message="$(cat diagnostics.txt)"
            message="${message//'%'/'%25'}"
            message="${message//$'\n'/'%0A'}"
            message="${message//$'\r'/'%0D'}"
            echo "::error title=Archive diagnostics::$message"
            exit "$status"
          fi

      - name: Package RootHide IPA
        shell: bash
        run: |
          set +e
          sh ./tools/release/create-ipa.sh --jailbroken 2>&1 | tee package-roothide.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            tail -n 120 package-roothide.log | cut -c1-400 > diagnostics.txt
            message="$(cat diagnostics.txt)"
            message="${message//'%'/'%25'}"
            message="${message//$'\n'/'%0A'}"
            message="${message//$'\r'/'%0D'}"
            echo "::error title=RootHide IPA packaging diagnostics::$message"
            exit "$status"
          fi

      - name: Verify RootHide IPA artifact
        run: |
          set -euo pipefail
          package="dist/Reynard-Jailbroken.ipa"
          test -s "$package"
          unzip -t "$package"
          shasum -a 256 "$package" | tee "$package.sha256"

      - name: Upload verified RootHide IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Reynard-RootHide-IPA-${{ github.sha }}
          path: |
            dist/Reynard-Jailbroken.ipa
            dist/Reynard-Jailbroken.ipa.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload package diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: package-logs-${{ github.sha }}
          path: |
            archive.log
            package-roothide.log
            diagnostics.txt
          if-no-files-found: ignore
          retention-days: 14
